services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.demo
    environment:
      POSTGRES_DB: salon_demo
      POSTGRES_USER: salon_demo
      POSTGRES_PASSWORD: SalonDemo2026!
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8030:8000"
    env_file: .env.demo
    volumes:
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    depends_on:
      - db

volumes:
  pgdata:
