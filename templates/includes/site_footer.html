{% load client_i18n %}
{% site_chrome as site %}
<footer class="lux-footer">
  <div class="lux-container footer-grid">
    <div><strong>{{ salon_name }}</strong><p>{{ site.t.footer_text }}</p></div>
    <div><a href="{% url 'service_index' %}">{{ site.t.nav_services }}</a><a href="{% url 'advice_index' %}">{{ site.t.nav_tips }}</a><a href="{% url 'privacy_policy' %}">Privacidad</a><a href="{% url 'terms' %}">Términos</a><a href="{% url 'data_deletion' %}">Eliminar datos</a><a href="/media/brimoon-release.apk" download>App BRIMOON (Android)</a></div>
    <div>
      <div class="footer-contact-links">
        <a class="footer-contact-chip" href="{{ site.whatsapp_url }}" target="_blank" rel="noopener">{{ site.t.footer_whatsapp }}</a>
        <a class="footer-contact-chip" href="tel:{{ site.phone }}">{{ site.t.footer_call }}</a>
      </div>
      <span>© 2026 {{ salon_name }}</span>
    </div>
  </div>
</footer>
