<style>
  .password-visibility {
    position: relative;
    display: block;
    width: 100%;
  }
  .password-visibility > input {
    width: 100%;
    padding-right: 48px !important;
  }
  .password-visibility__toggle {
    position: absolute;
    top: 50%;
    right: 5px;
    width: 38px;
    height: 38px;
    padding: 0;
    transform: translateY(-50%);
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 10px;
    color: currentColor;
    background: transparent;
    cursor: pointer;
    opacity: .72;
  }
  .password-visibility__toggle:hover,
  .password-visibility__toggle:focus-visible {
    opacity: 1;
    background: rgba(127, 127, 127, .14);
  }
  .password-visibility__toggle svg {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .password-visibility__slash { display: none; }
  .password-visibility__toggle[aria-pressed="true"] .password-visibility__slash { display: block; }
</style>
<script>
  (function () {
    function labels() {
      var lang = (document.documentElement.lang || 'es').toLowerCase();
      if (lang.indexOf('ru') === 0) return {show: 'Показать пароль', hide: 'Скрыть пароль'};
      if (lang.indexOf('en') === 0) return {show: 'Show password', hide: 'Hide password'};
      if (lang.indexOf('de') === 0) return {show: 'Passwort anzeigen', hide: 'Passwort ausblenden'};
      if (lang.indexOf('fr') === 0) return {show: 'Afficher le mot de passe', hide: 'Masquer le mot de passe'};
      return {show: 'Mostrar contrasena', hide: 'Ocultar contrasena'};
    }

    function installPasswordToggles() {
      var text = labels();
      document.querySelectorAll('input[type="password"]').forEach(function (input) {
        if (input.closest('.password-visibility')) return;
        var wrapper = document.createElement('span');
        wrapper.className = 'password-visibility';
        input.parentNode.insertBefore(wrapper, input);
        wrapper.appendChild(input);

        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'password-visibility__toggle';
        button.setAttribute('aria-label', text.show);
        button.setAttribute('title', text.show);
        button.setAttribute('aria-pressed', 'false');
        button.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.7"></circle><path class="password-visibility__slash" d="M4 4l16 16"></path></svg>';
        button.addEventListener('click', function () {
          var visible = input.type === 'text';
          input.type = visible ? 'password' : 'text';
          button.setAttribute('aria-pressed', visible ? 'false' : 'true');
          button.setAttribute('aria-label', visible ? text.show : text.hide);
          button.setAttribute('title', visible ? text.show : text.hide);
          input.focus({preventScroll: true});
          try { input.setSelectionRange(input.value.length, input.value.length); } catch (_) {}
        });
        wrapper.appendChild(button);
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', installPasswordToggles);
    } else {
      installPasswordToggles();
    }
  })();
</script>
